name: Lean proofs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          auto-config: false
          build: true
          build-args: "--wfail"
          use-mathlib-cache: true
          leanchecker: true
          leanchecker-args: "QuantumBackflow"
      - name: Test proof-integrity checks
        run: python3 -m unittest discover -s checks -p 'test_*.py'
      - name: Audit proof dependencies
        run: python3 checks/check_proofs.py
